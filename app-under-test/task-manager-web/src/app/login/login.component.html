<main class="auth-page">
  <section class="card" aria-labelledby="login-title">
    <h1 id="login-title">Sign in</h1>
    <p class="subtitle">Sign in to manage your tasks.</p>

    @if (serverError(); as message) {
      <div class="alert" role="alert" data-testid="login-error">{{ message }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate data-testid="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          data-testid="login-email"
          [attr.aria-invalid]="emailError() ? 'true' : null"
          [attr.aria-describedby]="emailError() ? 'email-error' : null"
        />
        @if (emailError(); as message) {
          <p id="email-error" class="field-error" data-testid="email-error">{{ message }}</p>
        }
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          data-testid="login-password"
          [attr.aria-invalid]="passwordError() ? 'true' : null"
          [attr.aria-describedby]="passwordError() ? 'password-error' : null"
        />
        @if (passwordError(); as message) {
          <p id="password-error" class="field-error" data-testid="password-error">{{ message }}</p>
        }
      </div>

      <button type="submit" class="primary" data-testid="login-submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>
